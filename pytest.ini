[pytest]
# Functionality tests only. Performance and prompt/model experiments live in
# local_testing/eval/ and are deliberately not pytest: a prompt does not pass or
# fail, it scores 0.03 better, and an assert cannot express that.
testpaths = backend/tests

# Live tests are opt-in because they need the network and a current deploy.
# `-m` takes the last value on the command line, so `pytest -m live` overrides
# this without any extra flag.
addopts = -m "not live"

markers =
    live: hits the deployed Netlify site and Modal app; tests the deploy, not the code
